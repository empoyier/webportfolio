    <style>
      :root { --red:#ff1f1e; --cream:#fdf6e7; --ink:#162119; }
      html { scrollbar-width:none; -ms-overflow-style:none; }
      html::-webkit-scrollbar { display:none; }
      * { box-sizing:border-box; }
      ::selection { color:var(--red); background:var(--cream); }
      body { min-height:100vh; margin:0; color:var(--cream); background:var(--red); font-family:Manrope,Arial,sans-serif; overflow-x:hidden; }
      a { color:inherit; text-decoration:none; }
      .site-header { position:fixed; z-index:20; top:0; left:0; width:100%; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
      .wordmark { font:30px/.76 Anton,Impact,sans-serif; letter-spacing:-.04em; text-transform:uppercase; width:73px; }
      .wordmark span { display:block; }
      .menu .contact { width:70px; height:70px; display:grid; place-items:center; background:var(--cream); border:4px solid var(--ink); border-radius:0; color:var(--ink); transition:background .3s ease, border-color .3s ease, color .3s ease; }
      .menu .contact::before { content:"\2715"; font:36px/.8 Anton,Impact,sans-serif; display:inline-block; animation:contact-x-wiggle 2.4s ease-in-out infinite; transition:transform .4s cubic-bezier(.16,1,.3,1); }
      @keyframes contact-x-wiggle { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg); } }
      .menu .contact:hover::before { animation-play-state:paused; transform:rotate(180deg) scale(1.15); }
      .menu .contact:hover { background:var(--ink); border-color:var(--cream); color:var(--cream); }

      /* centered nav block */
      .center-nav-wrap { position:fixed; z-index:2; top:50%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:34px; text-align:center; }
      .center-nav { display:flex; flex-direction:column; align-items:center; gap:8px; }
      .center-nav a { position:relative; font-family:Anton,Impact,sans-serif; font-size:clamp(56px,10vw,150px); line-height:.92; letter-spacing:-.03em; text-transform:uppercase; color:var(--cream); cursor:pointer; transition:color .25s, transform .25s; }
      .center-nav a:hover { color:var(--ink); transform:scale(1.04); }
      .center-nav a.current { color:var(--ink); }
      @media (max-width:700px) { .center-nav a { font-size:clamp(34px,13vw,80px); } .center-nav { gap:2px; } .center-nav-wrap { gap:20px; } }

      /* bottom enquiries bar */
      .enquiries { position:fixed; z-index:15; left:0; right:0; bottom:28px; display:flex; flex-direction:column; align-items:center; gap:10px; }
      .enquiries nav { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
      .enquiries a { font:700 12px/1 Manrope,Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase; transition:color .3s ease; }
      .enquiries a:hover { color:var(--ink); }
      @media (max-width:600px) { .enquiries { bottom:16px; } .enquiries nav { gap:16px; } }

      /* background line-drift animation */
      .line-field { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
      .line-field svg { position:absolute; width:220vmax; height:220vmax; left:50%; top:50%; transform:translate(-50%,-50%); opacity:.32; }
      .line-field path { fill:none; stroke:var(--cream); stroke-width:1.3; stroke-linecap:round; stroke-dasharray:26 18; }
      .line-field .set-a { animation:line-drift-a 70s linear infinite; }
      .line-field .set-b { animation:line-drift-b 90s linear infinite; opacity:.75; }
      @keyframes line-drift-a { from { transform:translate(-50%,-50%) rotate(0deg); } to { transform:translate(-50%,-50%) rotate(360deg); } }
      @keyframes line-drift-b { from { transform:translate(-50%,-50%) rotate(360deg); } to { transform:translate(-50%,-50%) rotate(0deg); } }
      @keyframes line-flow { to { stroke-dashoffset:-440; } }
      @media (prefers-reduced-motion:reduce) { .line-field .set-a, .line-field .set-b, .line-field path { animation:none; } }

      /* entrance animation */
      @keyframes fade-in { from { opacity:0; } to { opacity:1; } }
      .center-nav a { opacity:0; animation:fade-in .6s ease forwards; }
      .center-nav a:nth-child(1) { animation-delay:.3s; }
      .center-nav a:nth-child(2) { animation-delay:.4s; }
      .center-nav a:nth-child(3) { animation-delay:.5s; }
      .center-nav a:nth-child(4) { animation-delay:.6s; }
      .enquiries { opacity:0; animation:fade-in .7s ease .85s forwards; }
      .page-loader { position:fixed; inset:0; z-index:9999; pointer-events:none; }
      .loader-bars { position:absolute; inset:0; display:flex; }
      .loader-bars .bar { flex:1 1 20%; background:var(--cream); transform:translateY(0); transition:transform .8s cubic-bezier(.7,0,.3,1); }
      .loader-bars .bar:nth-child(1) { transition-delay:0s; }
      .loader-bars .bar:nth-child(2) { transition-delay:.07s; }
      .loader-bars .bar:nth-child(3) { transition-delay:.14s; }
      .loader-bars .bar:nth-child(4) { transition-delay:.21s; }
      .loader-bars .bar:nth-child(5) { transition-delay:.28s; }
      .page-loader.is-open .loader-bars .bar { transform:translateY(-102%); }
      .loader-content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; opacity:1; transition:opacity .35s ease; }
      .page-loader.is-open .loader-content { opacity:0; }
      .start-lights { display:flex; gap:16px; }
      .start-lights i { width:22px; height:22px; border-radius:50%; background:rgba(255,31,30,.16); border:2px solid rgba(255,31,30,.45); display:block; }
      .start-lights i:nth-child(1) { animation:light-1 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(2) { animation:light-2 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(3) { animation:light-3 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(4) { animation:light-4 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(5) { animation:light-5 2.4s ease-in-out infinite; }
      @keyframes light-1 { 0%,4% { background:rgba(255,31,30,.16); box-shadow:none; } 8%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-2 { 0%,17% { background:rgba(255,31,30,.16); box-shadow:none; } 21%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-3 { 0%,29% { background:rgba(255,31,30,.16); box-shadow:none; } 33%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-4 { 0%,42% { background:rgba(255,31,30,.16); box-shadow:none; } 46%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-5 { 0%,54% { background:rgba(255,31,30,.16); box-shadow:none; } 58%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @media (prefers-reduced-motion:reduce) { .loader-bars .bar { transition-duration:.25s; } .start-lights i { animation:none !important; background:var(--red); } }
    </style>

  <script>
    (function () {
      const loader = document.querySelector('.page-loader');
      if (!loader) return;
      const reveal = () => loader.classList.add('is-open');
      if (document.readyState === 'complete') {
        requestAnimationFrame(reveal);
      } else {
        window.addEventListener('load', reveal);
      }
      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || link.target === '_blank' || link.hasAttribute('download')) return;
        let url;
        try { url = new URL(href, window.location.href); } catch (e) { return; }
        if (url.origin !== window.location.origin) return;
        event.preventDefault();
        loader.classList.remove('is-open');
        setTimeout(() => { window.location.href = url.href; }, 1000);
      });
    })();
  </script>
