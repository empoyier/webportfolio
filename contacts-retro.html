    <style>
      :root { --red:#ff1f1e; --cream:#fdf6e7; --ink:#162119; --pistachio:#e9e9c7; } html { scrollbar-width:none; -ms-overflow-style:none; } html::-webkit-scrollbar { display:none; } * { box-sizing:border-box; } body { min-height:100vh; margin:0; color:var(--cream); background:var(--red); font-family:Manrope,Arial,sans-serif; } a { color:inherit; text-decoration:none; } .site-header { position:fixed; z-index:20; top:0; left:0; width:100%; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; } .wordmark { font:30px/.76 Anton,Impact,sans-serif; letter-spacing:-.04em; text-transform:uppercase; width:73px; color:var(--cream); } .wordmark span { display:block; } .menu { display:flex; gap:18px; align-items:center; } .menu .contact { width:70px; height:70px; display:grid; place-items:center; background:var(--cream); border:4px solid var(--ink); border-radius:0; color:var(--ink); transition:background .3s ease, border-color .3s ease, color .3s ease; } .menu .contact::before { content:"✕"; font:36px/.8 Anton,Impact,sans-serif; display:inline-block; animation:contact-x-wiggle 2.4s ease-in-out infinite; transition:transform .4s cubic-bezier(.16,1,.3,1); } @keyframes contact-x-wiggle { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg); } } .menu .contact:hover::before { animation-play-state:paused; transform:rotate(180deg) scale(1.15); } .menu .contact:hover { background:var(--ink); border-color:var(--cream); color:var(--cream); } main { position:fixed; z-index:1; top:50%; left:0; right:0; transform:translateY(-50%); padding:0 28px; } h1 { margin:0; font:clamp(72px,15vw,230px)/.76 Anton,Impact,sans-serif; letter-spacing:-.055em; text-transform:uppercase; color:var(--cream); } h1 a { display:inline-block; transition:color .45s cubic-bezier(.16,1,.3,1); color:var(--cream); } h1 a:hover { color:var(--ink); } @media (max-width:600px) { .site-header { padding:14px 16px; } main { padding:0 16px; } }

      /* right-side links */
      .links { position:fixed; z-index:20; top:50%; right:36px; transform:translateY(-50%); display:flex; flex-direction:column; align-items:flex-end; gap:22px; }
      .links a { display:inline-block; font-family:Anton,Impact,sans-serif; font-size:clamp(38px,5.8vw,76px); line-height:.82; letter-spacing:.02em; text-transform:uppercase; color:var(--cream); transition:color .3s ease, transform .3s ease; }
      .links a:hover { color:var(--ink); transform:translateX(-10px); }
      @media (max-width:700px) { .links { right:16px; gap:14px; } .links a { font-size:clamp(22px,7.6vw,40px); } }

      .footer { position:fixed; z-index:20; left:0; right:0; bottom:20px; text-align:center; font:600 12px/1 Manrope,Arial,sans-serif; letter-spacing:.08em; color:var(--cream); opacity:.7; }

      /* background marquee */
      .say-marquee { position:fixed; inset:0; z-index:0; display:flex; flex-direction:column; justify-content:center; gap:18px; overflow:hidden; pointer-events:none; }
      .say-marquee-row { display:flex; width:max-content; white-space:nowrap; animation:say-marquee-scroll 11s linear infinite; }
      .say-marquee-row span { display:inline-block; font:800 clamp(50px,12vw,180px)/1 Anton,Impact,sans-serif; letter-spacing:-.02em; text-transform:uppercase; color:rgba(253,246,231,.16); padding-right:.5em; }
      @keyframes say-marquee-scroll { from { transform:translate3d(0,0,0); } to { transform:translate3d(-50%,0,0); } }

      /* entrance animation */
      @keyframes fade-up { from { opacity:0; transform:translate3d(0,32px,0); } to { opacity:1; transform:translate3d(0,0,0); } }
      @keyframes fade-in { from { opacity:0; } to { opacity:1; } }
      h1 { opacity:0; animation:fade-up .8s cubic-bezier(.16,1,.3,1) .1s forwards; }
      .links a { opacity:0; animation:fade-in .6s ease forwards; }
      .links a:nth-child(1) { animation-delay:.4s; }
      .links a:nth-child(2) { animation-delay:.5s; }
      .links a:nth-child(3) { animation-delay:.6s; }
      .links a:nth-child(4) { animation-delay:.7s; }
      .links a:nth-child(5) { animation-delay:.8s; }
      .page-loader { position:fixed; inset:0; z-index:9999; pointer-events:none; }
      .loader-bars { position:absolute; inset:0; display:flex; }
      .loader-bars .bar { flex:1 1 20%; background:var(--cream); transform:translateY(0); transition:transform .8s cubic-bezier(.7,0,.3,1); }
      .loader-bars .bar:nth-child(1) { transition-delay:0s; }
      .loader-bars .bar:nth-child(2) { transition-delay:.07s; }
      .loader-bars .bar:nth-child(3) { transition-delay:.14s; }
      .loader-bars .bar:nth-child(4) { transition-delay:.21s; }
      .loader-bars .bar:nth-child(5) { transition-delay:.28s; }
      .page-loader.is-open .loader-bars .bar { transform:translateY(-102%); }
      .loader-content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; opacity:1; transition:opacity .35s ease; }
      .page-loader.is-open .loader-content { opacity:0; }
      .start-lights { display:flex; gap:16px; }
      .start-lights i { width:22px; height:22px; border-radius:50%; background:rgba(255,31,30,.16); border:2px solid rgba(255,31,30,.45); display:block; }
      .start-lights i:nth-child(1) { animation:light-1 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(2) { animation:light-2 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(3) { animation:light-3 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(4) { animation:light-4 2.4s ease-in-out infinite; }
      .start-lights i:nth-child(5) { animation:light-5 2.4s ease-in-out infinite; }
      @keyframes light-1 { 0%,4% { background:rgba(255,31,30,.16); box-shadow:none; } 8%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-2 { 0%,17% { background:rgba(255,31,30,.16); box-shadow:none; } 21%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-3 { 0%,29% { background:rgba(255,31,30,.16); box-shadow:none; } 33%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-4 { 0%,42% { background:rgba(255,31,30,.16); box-shadow:none; } 46%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @keyframes light-5 { 0%,54% { background:rgba(255,31,30,.16); box-shadow:none; } 58%,75% { background:var(--red); box-shadow:0 0 16px 3px rgba(255,31,30,.75); } 79%,100% { background:rgba(255,31,30,.16); box-shadow:none; } }
      @media (prefers-reduced-motion:reduce) { .loader-bars .bar { transition-duration:.25s; } .start-lights i { animation:none !important; background:var(--red); } }
    </style>

  <script>
    (function () {
      const loader = document.querySelector('.page-loader');
      if (!loader) return;
      const reveal = () => loader.classList.add('is-open');
      if (document.readyState === 'complete') {
        requestAnimationFrame(reveal);
      } else {
        window.addEventListener('load', reveal);
      }
      document.addEventListener('click', (event) => {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const href = link.getAttribute('href');
        if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || link.target === '_blank' || link.hasAttribute('download')) return;
        let url;
        try { url = new URL(href, window.location.href); } catch (e) { return; }
        if (url.origin !== window.location.origin) return;
        event.preventDefault();
        loader.classList.remove('is-open');
        setTimeout(() => { window.location.href = url.href; }, 1000);
      });
    })();
  </script>
